name: 'Build for executable'

on:
  push:
    branches:
      - main
      - feature/build-artifact

jobs:
  build:
    runs-on: '${{ matrix.platform.label }}-latest'
    strategy:
      matrix:
        platform:
          - label: 'windows'
            target: 'win'
          - label: 'macos'
            target: 'mac'
          - label: 'linux'
            target: 'linux'
    steps:
      - uses: actions/checkout@v6
      - uses: 'aquaproj/aqua-installer@a0f344b9b469334c1b4341f706abbd9ef1b99ca1'
        with:
          aqua_version: 'v2.55.0'
      - name: 'Install dependencies'
        run: |
          bun install
          bun neu update
      - name: 'Build executable'
        run: './scripts/build-${{ matrix.platform.target }}.sh'
        env:
          CMD_NEU: 'bun neu'
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform.label }}
          path: 'dist/${{ matrix.platform.target }}*'
          retention-days: 7
